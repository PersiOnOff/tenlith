name: tenlith

# Local development only. Read docs/deployment.md before deploying publicly.
services:
  init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - secrets:/run/tenlith
      - ./scripts/init-secrets.sh:/init-secrets.sh:ro
    entrypoint: ["/bin/sh", "/init-secrets.sh"]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: tenlith
      POSTGRES_USER: tenlith
      POSTGRES_PASSWORD_FILE: /run/tenlith/postgres_password
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - secrets:/run/tenlith:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenlith -d tenlith"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      App__PublicUrl: "${TENLITH_PUBLIC_URL:-http://localhost:8080}"
      Demo__Enabled: "${TENLITH_DEMO_ENABLED:-true}"
      Billing__Simulation: "${TENLITH_BILLING_SIMULATION:-true}"
      Mail__Host: mailpit
      Mail__Port: "1025"
      Mail__From: hello@tenlith.local
      DataProtection__KeysPath: /app/keys
      Proxy__KnownProxies__0: "${TENLITH_PROXY_IP:-172.30.227.10}"
      GitHub__ClientId: "${GITHUB_CLIENT_ID:-}"
      GitHub__ClientSecret: "${GITHUB_CLIENT_SECRET:-}"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY:-}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-}"
      Stripe__PriceId: "${STRIPE_PRICE_ID:-}"
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - secrets:/run/tenlith:ro
      - dataprotection:/app/keys
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TENLITH_WEB_PORT:-8080}:80"
    networks:
      default:
        ipv4_address: "${TENLITH_PROXY_IP:-172.30.227.10}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  secrets:
  postgres:
  dataprotection:

networks:
  default:
    ipam:
      config:
        - subnet: "${TENLITH_SUBNET:-172.30.227.0/24}"
