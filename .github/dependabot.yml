version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/Tenlith.Api
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      compatible-nuget:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /src/Tenlith.Web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      compatible-npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      compatible-actions:
        patterns: ["*"]
        update-types: [minor, patch]
