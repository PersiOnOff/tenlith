name: Feature request
description: Propose a focused improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a real workflow and who needs it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Smallest useful change
      description: Include alternatives you have considered.
    validations:
      required: true
