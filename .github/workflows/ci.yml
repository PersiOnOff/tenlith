name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: tenlith-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TENLITH_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=tenlith-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Tenlith.sln --locked-mode
      - run: dotnet test tests/Tenlith.Api.Tests/Tenlith.Api.Tests.csproj -c Release --no-restore --logger trx

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Tenlith.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Tenlith.Web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Tenlith.Web/package-lock.json
      - run: docker compose up --build -d --wait
      - run: node scripts/verify-stack.mjs --restart-api
      - run: npm ci
        working-directory: src/Tenlith.Web
      - run: npx playwright install --with-deps chromium
        working-directory: src/Tenlith.Web
      - run: npx playwright test
        working-directory: src/Tenlith.Web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
      - if: failure()
        run: docker compose logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report
          path: src/Tenlith.Web/playwright-report
      - if: always()
        run: docker compose down
